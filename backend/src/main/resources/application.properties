spring.application.name=stockpulse
server.port=8080

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:stockpulsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# CORS / Actuator
management.endpoints.web.exposure.include=*

# Optional OpenAI-compatible advisor configuration
llm.provider=${LLM_PROVIDER:}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:}
llm.base-url=${LLM_BASE_URL:}
llm.timeout-ms=${LLM_TIMEOUT_MS:5000}
